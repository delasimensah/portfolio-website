name: 🔒 Merge Protection

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, closed]
  pull_request_target:
    types: [closed]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  check-approval:
    name: ✅ Check PR Approval
    runs-on: ubuntu-latest

    steps:
      - name: 🔍 Check for approval label and authorization
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.pull_request.labels.map(l => l.name);
            const hasApproval = labels.includes('approved');
            const prAuthor = context.payload.pull_request.user.login;
            const currentActor = context.actor;

            console.log('Labels:', labels);
            console.log('Has approval:', hasApproval);
            console.log('PR Author:', prAuthor);
            console.log('Current Actor:', currentActor);

            if (!hasApproval) {
              core.setFailed('❌ PR must be approved before merging. Add the "approved" label to allow merging.');
              return;
            }

            // Check if approval was added by the PR author (not allowed)
            if (context.eventName === 'pull_request' && 
                context.payload.action === 'labeled' && 
                context.payload.label?.name === 'approved' &&
                currentActor === prAuthor) {
              
              // Remove the approval label
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                name: 'approved'
              });
              
              // Comment about self-approval rejection
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: `## 🚫 Self-Approval Rejected
                
                @${prAuthor}, you should not approve your own PR. The "approved" label has been automatically removed.
                
                **To get approval:**
                - Ask a team member to review your changes
                - They will add the "approved" label if the code meets our standards
                
                ---
                *Self-approval is not allowed to ensure code quality and peer review.*`
              });
              
              core.setFailed('❌ You should not approve your own PR. The "approved" label has been removed. Ask a team member to review and approve.');
              return;
            }

      - name: 💬 Comment on PR if not approved
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body: `## ❌ Missing Approval
              
              This PR should not be merged until it has been approved by a team member.
              
              **To get this PR approved:**
              1. Request a code review from a team member
              2. The team member will add the \`approved\` label to this PR
              3. You can then merge this PR
              
              **Important:** 
              - PR authors should not approve their own PRs
              - Self-approval attempts will be automatically rejected and the label removed
              
              ---
              *Merge protection is active to ensure code quality and prevent unauthorized merges.*`
            });

      - name: 🎉 Comment on approval
        if: success() && contains(github.event.action, 'labeled') && contains(github.event.label.name, 'approved')
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body: `## ✅ PR Approved!
              
              This PR has been approved and is ready to merge.
              
              **Approved by:** ${context.actor}
              
              ---
              *You can now merge this PR.*`
            });

  delete-branch-after-merge:
    name: 🗑️ Delete Branch After Merge
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true

    steps:
      - name: 🗑️ Delete branch
        uses: actions/github-script@v7
        with:
          script: |
            const branchName = context.payload.pull_request.head.ref;
            const repoOwner = context.repo.owner;
            const repoName = context.repo.repo;

            console.log(`🗑️ Attempting to delete branch: ${branchName}`);

            try {
              await github.rest.git.deleteRef({
                owner: repoOwner,
                repo: repoName,
                ref: `heads/${branchName}`
              });
              
              console.log(`✅ Successfully deleted branch: ${branchName}`);
              
              await github.rest.issues.createComment({
                owner: repoOwner,
                repo: repoName,
                issue_number: context.payload.pull_request.number,
                body: `## 🗑️ Branch Cleanup
                
                ✅ **Feature branch \`${branchName}\` has been automatically deleted** after successful merge.
                
                ---
                *Automatic cleanup by GitHub Actions*`
              });
              
            } catch (error) {
              console.log(`⚠️ Could not delete branch ${branchName}: ${error.message}`);
            }

